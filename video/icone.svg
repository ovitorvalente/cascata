  </defs>
  <!-- base -->
  <rect x="12" y="14" width="104" height="104" rx="24" fill="#1a4f94"/>
  <rect x="12" y="10" width="104" height="104" rx="24" fill="url(#bg)"/>
  <!-- três quedas d'água -->
  <rect x="34" y="26" width="12" height="34" rx="6" fill="url(#water)" opacity="0.7"/>
  <rect x="82" y="26" width="12" height="34" rx="6" fill="url(#water)" opacity="0.7"/>
  <rect x="57" y="24" width="14" height="46" rx="7" fill="url(#water)"/>
