[package]
name = "cascata"
version = "0.1.0"
edition = "2021"
description = "Baixe vídeos e áudios da internet com yt-dlp e FFmpeg"
license = "MIT"

[dependencies]
# As versões de gtk4 e libadwaita precisam andar juntas (ver livro do gtk-rs).
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
async-channel = "2"
# A mesma crate que o gtk4 já usa; aqui só liga a exportação de PNG.
cairo-rs = { version = "0.22", features = ["png"] }
# Ícone de bandeja (StatusNotifierItem) em Rust puro, sem tokio.
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
# Usa o gettext da glibc, sem compilar uma cópia própria.
gettext-rs = { version = "0.8", features = ["gettext-system"] }

[profile.release]
lto = true
strip = true
